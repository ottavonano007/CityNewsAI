name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 android/app/src/main/assets/citynewsai_launcher.svg -o android/app/src/main/res/drawable-nodpi/citynewsai_launcher.png
          test -s android/app/src/main/res/drawable-nodpi/citynewsai_launcher.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityNewsAI-debug-0.6.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: Keep only the 3 latest APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts?per_page=100&sort=created&direction=desc"
          response=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api") || {
            echo "::warning::Impossibile consultare gli Artifacts: pulizia rinviata."
            exit 0
          }
          mapfile -t obsolete < <(printf '%s' "$response" | jq -r '[.artifacts[] | select(.name == "CityNewsAI-debug-0.6.0" and .expired == false)] | sort_by(.created_at) | reverse | .[1:][] | .id')
          for artifact_id in "${obsolete[@]}"; do
            if ! curl -fsS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null; then
              echo "::warning::Non è stato possibile eliminare l'Artifact ${artifact_id}."
            else
              echo "Eliminato Artifact obsoleto: ${artifact_id}"
            fi
          done
