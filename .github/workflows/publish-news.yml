name: Publish local news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/publish-news.yml"

permissions:
  contents: write

concurrency:
  group: publish-local-news
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect and export articles
        working-directory: backend
        run: python -m citynews.publish
      - name: Publish JSON snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          if git diff --cached --quiet; then
            echo "No news changes to publish."
          else
            git commit -m "chore(news): refresh published local news feed"
            git pull --rebase origin main
            git push
          fi
